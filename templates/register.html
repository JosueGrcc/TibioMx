<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TibioMx — Registro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">TibioMx 🎲</div>
    <p class="auth-sub">Crear cuenta — empieza con 1,000 CuckostaPoints 🎉</p>

    {% if error %}
      <p class="flash-msg error" style="margin-bottom:16px;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label>Nombre de usuario</label>
        <input type="text" name="username" placeholder="@tibioprofe" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Correo institucional</label>
        <input type="email" name="email" placeholder="tu@universidad.edu.mx" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Contraseña (mínimo 6 caracteres)</label>
        <input type="password" name="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn primary" style="width:100%; margin-top:8px; justify-content:center;">
        Crear cuenta
      </button>
    </form>

    <p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Entrar</a></p>
  </div>
</div>
</body>
</html>
